<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>High Noon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#EADBC4; --text:#3A2516; --gold:#F2B544; --rust:#A8452A; --ink:#2A1A10;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--page:#1F140D;--text:#EADBC4;color-scheme:dark}
}
:root[data-theme="dark"]{--page:#1F140D;--text:#EADBC4;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--page);color:var(--text);overflow:hidden;
  font-family:"Pixelify Sans",ui-monospace,"Courier New",monospace;-webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none}
.stage{height:100%;display:grid;place-items:center;padding:12px}
.screen{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(40,20,5,.35);line-height:0;touch-action:none}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
@media (pointer:fine){ canvas{cursor:none} }

.hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:14px;padding:10px calc(12px + env(safe-area-inset-right,0px)) 10px calc(12px + env(safe-area-inset-left,0px));
  color:#fff;line-height:1;font-size:clamp(14px,2.2vw,19px);font-weight:700;text-shadow:0 2px 0 rgba(42,26,16,.6);pointer-events:none}
.hearts,.ammo{display:flex;gap:3px;align-items:center}
.hearts svg{width:clamp(15px,2.4vw,20px);height:auto}
.ammo svg{width:clamp(6px,1vw,8px);height:auto}
.lvl{margin-left:auto;opacity:.95}
.icon{pointer-events:auto;background:rgba(42,26,16,.4);color:#fff;border:0;border-radius:8px;width:34px;height:34px;
  display:grid;place-items:center;cursor:pointer;padding:0}
.icon svg{width:14px;height:14px}
.call{position:absolute;left:0;right:0;top:30%;text-align:center;color:#fff;font-weight:700;line-height:1;
  font-size:clamp(26px,7vw,60px);text-shadow:0 4px 0 var(--rust),0 6px 14px rgba(0,0,0,.3);pointer-events:none;
  opacity:0;transform:scale(.9);transition:opacity .12s,transform .12s}
.call.on{opacity:1;transform:none}
.call.small{font-size:clamp(18px,4vw,32px)}

.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(42,22,10,.62);line-height:1.35;overflow:auto}
.overlay[hidden]{display:none}
.card{text-align:center;color:#fff;padding:18px;max-width:44ch}
.card h1{margin:0;font-size:clamp(46px,10vw,86px);line-height:.95;color:var(--gold);text-shadow:0 5px 0 var(--rust);letter-spacing:.02em}
.card h2{margin:0 0 6px;font-size:clamp(26px,5.5vw,42px);line-height:1.05;color:var(--gold);text-shadow:0 4px 0 var(--rust)}
.card p{margin:10px 0 0;font-size:clamp(14px,2.2vw,17px);font-weight:500}
.card .hint{opacity:.85;font-size:clamp(12px,1.8vw,14px)}
.btn{font:inherit;font-weight:700;font-size:clamp(16px,2.5vw,20px);background:var(--gold);color:var(--ink);border:0;border-radius:10px;
  padding:10px 24px;margin-top:14px;box-shadow:0 4px 0 var(--rust);cursor:pointer}
.btn.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5);margin-left:8px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--rust)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.levels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:12px}
.lv{font:inherit;font-weight:700;font-size:clamp(15px,2.4vw,19px);background:#F6E7CC;color:var(--ink);border:0;border-radius:10px;
  padding:8px 4px 6px;cursor:pointer;box-shadow:0 3px 0 var(--rust);display:grid;gap:3px;justify-items:center;line-height:1}
.lv.duel{background:var(--gold)}
.lv[disabled]{opacity:.4;cursor:default;box-shadow:none}
.lv .st{display:flex;gap:1px}
.lv .st svg{width:9px;height:9px}
.rotate{display:none;position:fixed;inset:0;z-index:5;background:var(--page);color:var(--text);place-items:center;text-align:center;padding:24px;line-height:1.4}
.rotate svg{width:64px;height:64px;margin-bottom:12px}
.rotate p{margin:0;font-size:18px;font-weight:700}
.rotate span{display:block;font-weight:500;font-size:14px;opacity:.75;margin-top:6px}
@media (pointer:coarse) and (orientation:portrait){ .rotate{display:grid} }
.card.wide{max-width:min(94vw,920px);width:100%}
.board{display:flex;gap:clamp(10px,2vw,18px);overflow-x:auto;scroll-snap-type:x mandatory;padding:14px 10px 18px;margin:6px -6px 0;
  background:repeating-linear-gradient(90deg,#6E4526 0 38px,#653F22 38px 40px);border-radius:8px;box-shadow:inset 0 0 0 3px #4A2C16}
.poster{flex:0 0 clamp(116px,17vw,158px);scroll-snap-align:center;background:#EBD9B0;color:#3A2516;border:0;border-radius:2px;
  padding:12px 8px 10px;font:inherit;cursor:pointer;position:relative;box-shadow:0 5px 0 rgba(0,0,0,.28);transform:rotate(var(--r,0deg));
  text-align:center;display:grid;gap:4px;justify-items:center;line-height:1.1}
.poster::before{content:"";position:absolute;top:4px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#8E2A1E;box-shadow:0 1px 0 rgba(0,0,0,.4)}
.poster:not([disabled]):hover{transform:rotate(0deg) translateY(-2px)}
.poster .wt{font-size:clamp(17px,2.5vw,23px);font-weight:700;letter-spacing:.1em;color:#6B2A1A}
.poster .pic{width:72%;background:#D9C08C;border:2px solid #6E4526;display:block;line-height:0}
.poster img{width:100%;aspect-ratio:14/13;image-rendering:pixelated;display:block}
.poster .nm{font-weight:700;font-size:clamp(13px,1.8vw,16px)}
.poster .cr{font-size:clamp(10px,1.3vw,12px);opacity:.8;font-weight:500;min-height:2.2em}
.poster .rw{font-weight:700;font-size:clamp(14px,2vw,18px);color:#6B2A1A}
.poster .pg{font-size:clamp(10px,1.3vw,12px);display:flex;gap:4px;align-items:center;font-weight:500}
.poster .pg svg{width:10px;height:10px}
.poster[disabled]{cursor:default}
.poster[disabled] img{filter:brightness(0) opacity(.75)}
.stamp{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);border:3px solid #B8323E;color:#B8323E;
  font-weight:700;padding:3px 8px;font-size:clamp(13px,1.9vw,17px);letter-spacing:.06em;background:rgba(235,217,176,.55);white-space:nowrap;pointer-events:none}
.stamp.soon{border-color:#5A4A3A;color:#5A4A3A;transform:translate(-50%,-50%) rotate(-8deg)}
.stamp.fresh{animation:stampIn .45s cubic-bezier(.2,1.6,.4,1) .35s both}
@keyframes stampIn{from{transform:translate(-50%,-50%) rotate(-14deg) scale(2.4);opacity:0}to{transform:translate(-50%,-50%) rotate(-14deg) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.stamp.fresh{animation:none}}
@media (max-height:440px){.card.wide h2{font-size:28px;margin-bottom:2px}.board{padding:10px 8px 12px}.poster{padding:9px 7px 8px;gap:3px}.poster .pic{width:60%}}
.back{font:inherit;font-weight:700;background:none;border:0;color:#fff;opacity:.85;cursor:pointer;padding:4px 0;margin-bottom:4px;font-size:clamp(13px,1.9vw,15px)}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.logo{font-size:clamp(30px,6vw,52px)!important;margin:0!important}
.bucks{background:#2A1A10;color:var(--gold);font-weight:700;border-radius:999px;padding:5px 12px;font-size:clamp(14px,2vw,17px);box-shadow:inset 0 0 0 2px var(--gold);white-space:nowrap}
.home{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(12px,2.5vw,24px);align-items:center;text-align:left}
.feature{display:grid;justify-items:center;gap:4px}
.feature .poster{cursor:default;flex:none;width:clamp(116px,17vw,150px)}
.feature .btn{margin-top:8px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{font:inherit;background:#F6E7CC;color:var(--ink);border:0;border-radius:10px;padding:9px 10px;box-shadow:0 3px 0 var(--rust);
  display:grid;gap:2px;justify-items:start;text-align:left;cursor:pointer;position:relative;line-height:1.15}
.tile b{font-size:clamp(14px,2vw,17px)}
.tile span{font-size:clamp(11px,1.5vw,13px);opacity:.75}
.tile.soon{background:#DCCBA8;box-shadow:0 3px 0 #8E6A48}
.tile.duelcard{grid-column:1/-1;grid-template-columns:auto 1fr;align-items:center;column-gap:12px;background:#3A2516;color:#F6E7CC;box-shadow:0 3px 0 #1E120A}
.tile.duelcard canvas{width:clamp(96px,14vw,144px);image-rendering:pixelated;grid-row:span 2;border-radius:4px}
.tile.duelcard .stamp{position:static;transform:rotate(-4deg);justify-self:start;font-size:12px;padding:1px 6px;background:none;border-color:#E8C36A;color:#E8C36A;opacity:1}
.stamp.inline{position:static;display:inline-block;transform:rotate(-4deg)}
.pay{font-weight:700;color:var(--gold)}
.smith{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;text-align:left;margin-top:6px}
.bench{background:#2A1A10;border-radius:10px;padding:12px;box-shadow:inset 0 0 0 2px #5A3A24}
.bench canvas{width:100%;max-width:300px;display:block;margin:0 auto;image-rendering:pixelated;background:repeating-linear-gradient(90deg,#4A2C16 0 30px,#43281A 30px 32px);border-radius:6px;padding:6px}
.bench h3{margin:8px 0 0;color:var(--gold);font-size:clamp(18px,2.6vw,22px)}
.bench .hint{margin:2px 0 6px}
.statbar{display:grid;grid-template-columns:72px 1fr;align-items:center;gap:8px;font-size:12px;margin:3px 0}
.statbar i{height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}
.statbar b{display:block;height:100%;background:var(--gold)}
.fins{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.fin{font:inherit;background:#3A2516;color:#F6E7CC;border:0;border-radius:8px;padding:6px 4px;cursor:pointer;display:grid;gap:2px;justify-items:center;line-height:1.1;box-shadow:inset 0 0 0 2px transparent}
.fin.on{box-shadow:inset 0 0 0 2px var(--gold)}
.fin i{width:26px;height:10px;border-radius:2px;background:linear-gradient(90deg,var(--a) 60%,var(--b) 60%)}
.fin span{font-size:11px;text-align:center}
.fin small{font-size:10px;opacity:.75}
.act{margin-top:6px}
.act .btn{margin-top:6px}
.btn[disabled]{opacity:.55;cursor:default;transform:none}
.lock,.confirm{margin:8px 0 0;font-size:14px}
.rack{display:grid;gap:6px;align-content:start}
.gunrow{font:inherit;display:flex;justify-content:space-between;align-items:center;background:#F6E7CC;color:var(--ink);border:0;border-radius:8px;padding:8px 10px;cursor:pointer;box-shadow:0 2px 0 var(--rust)}
.gunrow b{font-size:clamp(14px,1.9vw,16px)}
.gunrow span{font-size:12px;font-weight:700;opacity:.8}
.gunrow.on{background:var(--gold)}
.gunrow.locked{opacity:.6}
@media (max-height:440px){.home .poster .pic{width:60%}.tile{padding:6px 8px}.card.wide h2{font-size:26px;margin:0 0 2px}.smith{gap:10px;margin-top:2px}.bench{padding:8px}.bench canvas{max-width:150px;padding:3px}.bench h3{margin-top:4px}.bench .hint{display:none}.statbar{margin:1px 0}.gunrow{padding:6px 10px}.rack .hint{display:none}.fins{margin-top:5px}}
.prof{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(12px,2.5vw,26px);text-align:left;align-items:start}
.mine{display:grid;justify-items:center;gap:6px}
.poster.me{cursor:default;flex:none;width:clamp(130px,19vw,170px);transform:rotate(-1.5deg)}
.rankstamp{top:16%;left:auto;right:-10px;font-size:clamp(10px,1.4vw,13px);border-color:#2A5A9A;color:#2A5A9A;background:rgba(235,217,176,.85);transform:rotate(12deg)}
.rankname{margin:0;color:var(--gold);font-size:clamp(20px,3vw,28px)}
.rankbar{display:grid;gap:4px;margin:4px 0 8px;font-size:13px}
.rankbar i{height:7px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden}
.rankbar i b{display:block;height:100%;background:var(--gold)}
.side h4{margin:6px 0 4px;font-size:14px;opacity:.85}
.shelf{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;background:#4A2C16;padding:6px;border-radius:6px;box-shadow:inset 0 -4px 0 #2A1A10}
.trophy{aspect-ratio:1;display:grid;place-items:center;background:rgba(0,0,0,.18);border-radius:4px}
.trophy img{width:80%;image-rendering:pixelated}
.trophy.empty img{opacity:.35}
.ledger{display:grid;grid-template-columns:repeat(2,auto auto);gap:3px 12px;margin:10px 0 0;font-size:clamp(12px,1.7vw,14px)}
.ledger dt{opacity:.7}
.ledger dd{margin:0;font-weight:700;text-align:right}
.editor{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(12px,2.5vw,24px);text-align:left;align-items:start}
.mirror{display:grid;justify-items:center;gap:8px}
.mirror canvas{width:clamp(84px,13vw,120px);image-rendering:pixelated;background:#D9C08C;border:3px solid #6E4526;border-radius:4px;padding:6px}
.namefield{display:grid;gap:3px;font-size:12px}
.namefield input{font:inherit;font-size:16px;font-weight:700;width:clamp(120px,18vw,160px);padding:6px 8px;border-radius:8px;border:2px solid #6E4526;background:#F6E7CC;color:var(--ink)}
.parts{display:grid;gap:6px}
.partrow{display:grid;grid-template-columns:76px minmax(0,1fr);align-items:center;gap:8px}
.pl{font-size:13px;opacity:.85}
.opts{display:flex;flex-wrap:wrap;gap:5px}
.opt{font:inherit;background:#F6E7CC;color:var(--ink);border:0;border-radius:7px;padding:4px 6px;min-width:34px;min-height:30px;cursor:pointer;display:grid;justify-items:center;gap:1px;box-shadow:inset 0 0 0 2px transparent;line-height:1.05}
.opt.on{box-shadow:inset 0 0 0 3px var(--gold)}
.opt i{width:20px;height:14px;border-radius:3px;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.opt i.none{background:repeating-linear-gradient(45deg,#ccc 0 3px,#fff 3px 6px)!important}
.opt span{font-size:12px;font-weight:700}
.opt small{font-size:9px;font-weight:700;opacity:.75;max-width:70px;text-align:center}
.opt.locked{opacity:.6}
@media (max-height:440px){.poster.me .pic{width:58%}.shelf{padding:4px}.ledger{margin-top:6px}.opt{min-height:26px;padding:3px 5px}.parts{gap:4px}}
.clue{background:rgba(255,212,94,.15);border-left:3px solid var(--gold);padding:6px 10px;border-radius:4px;text-align:left}
.adtag{display:inline-block;background:#B8323E;color:#fff;font-weight:700;font-size:12px;padding:2px 8px;border-radius:4px;letter-spacing:.08em}
.adbar{height:8px;background:rgba(255,255,255,.2);border-radius:4px;overflow:hidden;margin:12px auto 0;max-width:260px}
.adbar b{display:block;height:100%;background:var(--gold);transition:width .9s linear}
.passmark{color:#8E2A1E;margin-right:6px}
.supporter{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);background:#2A1A10;color:#F2B544;font-weight:700;font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pending{font-size:12px;color:#F2B544;margin:0 0 6px}
.devrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.devrow .btn{margin:6px 0 0}
.evlog,.tests{list-style:none;padding:0;margin:6px 0 0;text-align:left;font-size:12px;max-height:46vh;overflow:auto;display:grid;gap:2px}
.tests{columns:2;display:block}
.tests li{break-inside:avoid;padding:1px 0}
.tests .pass{color:#B8F2C0}.tests .failt{color:#FF9A8A}
.card.full{max-width:none;width:100%;height:100%;padding:0}
.overlay.clear{background:none}
.overlay.fadeout{background:#000;transition:background .4s}
.overlay.fadeout .card{opacity:0;transition:opacity .3s}
.standoff{position:relative;width:100%;height:100%;cursor:pointer;outline:none;display:flex;flex-direction:column;align-items:center;padding-top:0}
.card .inktitle{position:relative;margin:auto 0 0;font-size:clamp(36px,9.5vh,88px);letter-spacing:.06em;color:#3A1A10;line-height:1;
  text-shadow:0 0 0 #3A1A10,3px 3px 0 rgba(142,42,30,.55);transform:rotate(-4deg);opacity:0;
}
.standoff.begun .inktitle{animation:inkstamp .35s cubic-bezier(.2,1.6,.4,1) 3.2s forwards}
.begin{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:8px;color:#F6E7CC;text-align:center}
.begin b{font-size:clamp(18px,3.6vh,26px);letter-spacing:.2em;text-transform:uppercase;animation:blink 1.4s infinite}
.begin span{font-size:clamp(12px,2vh,14px);opacity:.7}
.standoff.begun .begin{display:none}
.mbtn{pointer-events:auto;background:rgba(20,12,6,.6);color:var(--gold);border:0;border-radius:999px;width:30px;height:30px;display:grid;place-items:center;cursor:pointer;padding:0}
.mbtn svg{width:14px;height:14px}
.mbtn.off{color:#8A7A60;opacity:.7}
.mbtn.off svg{opacity:.5}
.standoff .tap{margin:auto 0 5%;color:#3A1A10;font-weight:700;letter-spacing:.24em;text-transform:uppercase;font-size:clamp(13px,2.4vh,18px);
  background:rgba(246,235,200,.75);padding:6px 14px;border-radius:999px;opacity:0}
.standoff.begun .tap{animation:fadein .5s 3.8s forwards,blink 1.2s 4.4s infinite}
.card .standoff.shot .inktitle{animation:none;opacity:1}
.standoff.shot .tap{animation:none;opacity:0;transition:opacity .2s}
@keyframes inkstamp{from{opacity:0;transform:rotate(-4deg) scale(2.6)}to{opacity:1;transform:rotate(-4deg) scale(1)}}
.office{position:relative;width:100%;height:100%}
.otop{position:absolute;left:0;right:0;top:0;display:flex;justify-content:flex-start;gap:12px;align-items:center;padding:8px calc(12px + env(safe-area-inset-right,0px)) 0 calc(12px + env(safe-area-inset-left,0px));pointer-events:none}
.otop .bucks{pointer-events:auto}
.ologo{font-weight:700;color:var(--gold);font-size:clamp(18px,3.4vw,28px);text-shadow:0 3px 0 var(--rust)}
.hs{position:absolute;background:none;border:0;padding:0;cursor:pointer;border-radius:6px;display:flex;align-items:flex-end;justify-content:center;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.hs::before{content:"";position:absolute;inset:-6px}
.hs:active{background:rgba(255,212,94,.18);box-shadow:0 0 0 2px rgba(255,212,94,.9)}
.hs:active .plaque{transform:translateY(55%) scale(.94)}
.hs:hover,.hs:focus-visible{box-shadow:0 0 0 2px rgba(255,212,94,.85),0 0 16px rgba(255,212,94,.5);outline:none}
.plaque{position:relative;transform:translateY(55%);background:linear-gradient(#D9B866,#C29A48);color:#2A1A10;font-weight:700;font-size:clamp(12px,1.8vw,15px);line-height:1;padding:5px 9px;min-height:22px;transition:transform .08s;letter-spacing:.02em;border-radius:3px;
  box-shadow:0 2px 0 #4A2C16,inset 0 0 0 1px #8A6A2E,inset 0 1px 0 rgba(255,255,255,.35);border-radius:2px;white-space:nowrap;display:inline-flex;gap:5px;align-items:center}
.plaque b{font-size:1.2em;line-height:.8;margin-left:1px}
.hs.soon .plaque{background:linear-gradient(#C7B796,#AE9E7C);box-shadow:0 2px 0 #4A3A26,inset 0 0 0 1px #8A7A5A}
.plaque em{font-style:normal;background:#2A1A10;color:#F2B544;font-size:.75em;padding:1px 4px;border-radius:2px}
.hs.small .plaque{font-size:clamp(11px,1.5vw,13px);padding:4px 6px;min-height:20px}
.hs.dev .plaque{background:#3A5A9A;color:#fff;box-shadow:0 2px 0 #1E2E50}
.coach{position:absolute;left:50%;top:2%;transform:translateX(-50%) rotate(-1.2deg);background:#EFE2C2;color:#2A1A10;border:0;border-radius:1px;
  padding:6px 14px 7px;font-size:clamp(12px,1.8vw,15px);white-space:nowrap;pointer-events:none;box-shadow:0 3px 0 rgba(0,0,0,.25),inset 0 0 0 1px rgba(110,69,38,.25);
  display:flex;gap:8px;align-items:baseline;animation:coachIn .4s .3s both}
.coach::before{content:"";position:absolute;top:-3px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#8E2A1E}

<p>Turn your phone sideways</p><span>High Noon plays in landscape so the outlaws are big enough to hit.</span></div></div>

<script>
(() => {
  const cv = document.getElementById('c'), g = cv.getContext('2d');

  }

  const store = {
    get(k, d) { try { const v = localStorage.getItem('highnoon:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('highnoon:' + k, JSON.stringify(v)); } catch (e) {} }
  };
  let soundOn = store.get('sound', true);
  const prog = (() => { const p = store.get('progress3', null); if (p && p.ch) return p;
    return {ch: [store.get('progress2', {unlocked: 1, stars: {}})]}; })();
  prog.bucks = prog.bucks || 0;
  prog.stats = Object.assign({shots: 0, hits: 0, kills: 0, levels: 0, perfect: 0, bosses: 0, earned: 0}, prog.stats || {});
  prog.inv = prog.inv || {guns: {peacemaker: true}, fins: {'peacemaker:0': true}, equip: {gun: 'peacemaker', fin: 0}};
  const save = () => store.set('progress3', prog);
  let ci = 0;
  const P = (i = ci) => (prog.ch[i] = prog.ch[i] || {unlocked: 1, stars: {}});

  // ---------- sound ----------
  let ac = null, noiseBuf = null;
  function A() {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    if (!noiseBuf) { noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    return ac;
  }
  function noise(d, f1, f2, vol, delay = 0) {
    if (!soundOn) return;
    try {
      const a = A(), t = a.currentTime + delay, s = a.createBufferSource(), f = a.createBiquadFilter(), v = a.createGain();
      s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.setValueAtTime(f1, t); f.frequency.exponentialRampToValueAtTime(f2, t + d);
      v.gain.setValueAtTime(vol, t); v.gain.exponentialRampToValueAtTime(0.0001, t + d);
      s.connect(f).connect(v).connect(a.destination); s.start(t); s.stop(t + d);
    } catch (e) {}
  }
  function tone(f1, f2, d, type = 'square', vol = 0.04, delay = 0, vib = 0) {

    try {
      const a = A(), t = a.currentTime + delay, o = a.createOscillator(), v = a.createGain();

      v.gain.setValueAtTime(0.0001, t); v.gain.linearRampToValueAtTime(vol, t + 0.02); v.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(v).connect(a.destination); o.start(t); o.stop(t + d + 0.02);
    } catch (e) {}
  }
  const whistle = (notes) => { let t = 0; notes.forEach(([f, d]) => { tone(f, f * 1.001, d, 'sine', 0.06, t, 8); t += d; }); };
  const sfx = {
    shot: () => { noise(0.25, 4000, 200, 0.35); tone(140, 50, 0.15, 'square', 0.06); },
    enemyShot: () => { noise(0.3, 2500, 150, 0.22, 0.02); tone(110, 45, 0.2, 'sawtooth', 0.05); },
    thunk: () => { tone(220, 90, 0.08, 'triangle', 0.12); noise(0.06, 1800, 400, 0.08); },
    glass: () => { tone(2400, 1800, 0.08, 'triangle', 0.05); tone(3100, 2600, 0.1, 'triangle', 0.04, 0.03); noise(0.15, 8000, 3000, 0.06); },
    down: () => tone(300, 120, 0.25, 'square', 0.04),
    boom: () => { noise(1.1, 1500, 60, 0.5); tone(70, 30, 0.8, 'sine', 0.2); },
    crash: () => { noise(0.5, 1200, 100, 0.3); tone(120, 60, 0.3, 'triangle', 0.1); },
    miss: () => { tone(2600, 800, 0.2, 'sine', 0.03); noise(0.05, 5000, 2000, 0.05); },
    ping: () => { tone(3400, 2600, 0.14, 'triangle', 0.06); tone(5200, 4800, 0.06, 'sine', 0.02); },
    card: () => noise(0.06, 6000, 2500, 0.08),
    tick: () => [0, 1, 2].forEach(i => tone(1900, 1700, 0.03, 'square', 0.035, i * 0.09)),
    cock: () => { tone(700, 450, 0.06, 'square', 0.05); noise(0.05, 4000, 1500, 0.06); },
    rustle: () => { noise(0.18, 3500, 1200, 0.12); noise(0.12, 2500, 900, 0.08, 0.08); },
    creak: () => { tone(160, 110, 0.32, 'sawtooth', 0.03, 0, 18); tone(240, 180, 0.2, 'triangle', 0.025, 0.05, 10); },
    tick2: () => tone(2600, 2400, 0.05, 'square', 0.03),
    flip: () => { noise(0.07, 5000, 2000, 0.09); noise(0.06, 4500, 1800, 0.06, 0.07); },
    thump: () => { tone(120, 60, 0.15, 'triangle', 0.12); noise(0.08, 900, 200, 0.12); },
    clank: () => { tone(900, 500, 0.12, 'square', 0.05); noise(0.15, 3000, 600, 0.12); },
    rumble: () => noise(1.2, 300, 90, 0.25),
    bell: () => { tone(1320, 1310, 0.9, 'sine', 0.08); tone(1980, 1970, 0.6, 'sine', 0.03); },
    win: () => whistle([[587, .18], [784, .18], [880, .36], [784, .18], [988, .5]]),
    lose: () => whistle([[523, .25], [466, .25], [392, .6]])
  };


  // ---------- music: an original Western score, synthesised live (no recordings, no licences) ----------
  let musicOn = store.get('music', true);
  const MUS = (() => {
    const NOTE = n => { const m = /^([A-G])(#|b)?(-?\d)$/.exec(n); const st = {C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2}[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (m[3] - 4) * 12; return 440 * Math.pow(2, st / 12); };
    let bus = null, cue = null, step = 0, nextT = 0, timer = null, want = null, duckV = 1;
    const env = (a, g, t, att, peak, dec, sus, rel, end) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + att); g.gain.exponentialRampToValueAtTime(Math.max(0.0001, peak * sus), t + att + dec); g.gain.setValueAtTime(Math.max(0.0001, peak * sus), end); g.gain.exponentialRampToValueAtTime(0.0001, end + rel); };
    const osc = (a, type, f, t, end) => { const o = a.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.start(t); o.stop(end + 0.6); return o; };
    const vib = (a, o, t, rate, depth, delay = 0.15) => { const l = a.createOscillator(), lg = a.createGain(); l.frequency.value = rate; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(depth, t + delay + 0.1); l.connect(lg).connect(o.frequency); l.start(t); l.stop(t + 8); };
    const V = {
      whistle(a, out, t, f, d, v) { const o = osc(a, 'sine', f * 0.97, t, t + d); o.frequency.exponentialRampToValueAtTime(f, t + 0.06); vib(a, o, t, 5.6, f * 0.012); const g = a.createGain(); env(a, g, t, 0.05, v, 0.1, 0.85, 0.12, t + d); o.connect(g).connect(out); },
      trumpet(a, out, t, f, d, v) { const o = osc(a, 'square', f, t, t + d), fl = a.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.setValueAtTime(900, t); fl.frequency.exponentialRampToValueAtTime(2600, t + 0.06); vib(a, o, t, 5.2, f * 0.008, 0.25); const g = a.createGain(); env(a, g, t, 0.03, v, 0.12, 0.7, 0.08, t + d); o.connect(fl).connect(g).connect(out); },
      harmonica(a, out, t, f, d, v) { const o = osc(a, 'sawtooth', f, t, t + d), o2 = osc(a, 'sawtooth', f * 1.004, t, t + d), fl = a.createBiquadFilter(); fl.type = 'bandpass'; fl.frequency.value = 1500; fl.Q.value = 0.8; vib(a, o, t, 6, f * 0.01, 0.2); const g = a.createGain(); env(a, g, t, 0.06, v, 0.1, 0.8, 0.1, t + d); o.connect(fl); o2.connect(fl); fl.connect(g).connect(out); },
      guitar(a, out, t, f, d, v) { const o = osc(a, 'sawtooth', f, t, t + d), o2 = osc(a, 'square', f * 1.003, t, t + d), fl = a.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.setValueAtTime(3200, t); fl.frequency.exponentialRampToValueAtTime(500, t + 0.3); const g = a.createGain(); env(a, g, t, 0.003, v, 0.16, 0.25, 0.12, t + d); o.connect(fl); o2.connect(fl); fl.connect(g).connect(out); },
      banjo(a, out, t, f, d, v) { const o = osc(a, 'square', f, t, t + 0.12), fl = a.createBiquadFilter(); fl.type = 'highpass'; fl.frequency.value = 500; const g = a.createGain(); env(a, g, t, 0.002, v, 0.09, 0.15, 0.05, t + Math.min(d, 0.12)); o.connect(fl).connect(g).connect(out); },
      bass(a, out, t, f, d, v) { const o = osc(a, 'triangle', f, t, t + d); const g = a.createGain(); env(a, g, t, 0.005, v, 0.18, 0.5, 0.08, t + d); o.connect(g).connect(out); },
      drone(a, out, t, f, d, v) { const o = osc(a, 'sawtooth', f, t, t + d), fl = a.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.setValueAtTime(220, t); fl.frequency.linearRampToValueAtTime(520, t + d); const g = a.createGain(); env(a, g, t, 0.4, v, 0.3, 0.9, 0.4, t + d); o.connect(fl).connect(g).connect(out); },
      kick(a, out, t, f, d, v) { const o = osc(a, 'sine', 120, t, t + 0.2); o.frequency.exponentialRampToValueAtTime(42, t + 0.14); const g = a.createGain(); env(a, g, t, 0.003, v, 0.14, 0.01, 0.02, t + 0.15); o.connect(g).connect(out); },
      brush(a, out, t, f, d, v) { const s = a.createBufferSource(); s.buffer = noiseBuf; const fl = a.createBiquadFilter(); fl.type = 'bandpass'; fl.frequency.value = 3200; fl.Q.value = 0.7; const g = a.createGain(); env(a, g, t, 0.004, v, 0.07, 0.05, 0.03, t + 0.08); s.connect(fl).connect(g).connect(out); s.start(t, Math.random() * 0.5); s.stop(t + 0.2); },
      chuff(a, out, t, f, d, v) { const s = a.createBufferSource(); s.buffer = noiseBuf; const fl = a.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.setValueAtTime(1400, t); fl.frequency.exponentialRampToValueAtTime(300, t + 0.12); const g = a.createGain(); env(a, g, t, 0.01, v, 0.1, 0.05, 0.03, t + 0.12); s.connect(fl).connect(g).connect(out); s.start(t, Math.random() * 0.5); s.stop(t + 0.25); },
      clop(a, out, t, f, d, v) { const o = osc(a, 'sine', f, t, t + 0.06); const g = a.createGain(); env(a, g, t, 0.002, v, 0.04, 0.01, 0.01, t + 0.05); o.connect(g).connect(out); },
      tick(a, out, t, f, d, v) { const o = osc(a, 'square', f, t, t + 0.03), fl = a.createBiquadFilter(); fl.type = 'highpass'; fl.frequency.value = 1500; const g = a.createGain(); env(a, g, t, 0.001, v, 0.015, 0.01, 0.01, t + 0.02); o.connect(fl).connect(g).connect(out); }
    };
    // ---- the compositions (all original) ----
    const seq = (str, voice, vel, start = 0) => { const ev = []; let st = start; for (const tok of str.trim().split(/\s+/)) { const [n, len] = tok.split(':'); const l = +len; if (n !== 'r') n.split('+').forEach(nn => ev.push([st, voice, nn, l, vel])); st += l; } return ev; };
    const drum = (pat, voice, vel, bars, f = 0, start = 0) => { const ev = []; for (let b = 0; b < bars; b++) [...pat].forEach((c, i) => { if (c !== '.') ev.push([start + b * pat.length + i, voice, f, 1, c === 'X' ? vel : vel * 0.55]); }); return ev; };
    const chordsAt = (list, voice, vel, steps, len) => { const ev = []; list.forEach((ch, bar) => steps.forEach((s2, k) => ch.split('+').forEach((n, j) => ev.push([bar * 16 + s2 + j * 0.06, voice, n, len, vel * (k % 2 ? 0.8 : 1)])))); return ev; };

  // geometry of an enemy right now: {x, y(top), w, h, clip}
  function geo(e) {

  // ---------- shooting ----------

      else if (type === 'continue') {
        hearts = 2; hurtFlash = 0; hide(); state = 'play'; hudKey = '';
        if (duel) Object.assign(duel, {phase: 'intro', t: 0, pose: 'idle', fall: 0, dark: false, card: null});
        for (const e of enemies) if (e.alive && e.state === 'aim') e.state = 'drop';
        call('Back up!', true, 900);
      } else if (type === 'hint') {
        prog.hints = prog.hints || {}; prog.hints[hintKey()] = Math.min(2, hintLvl() + 1); save();
        show(`<h2>Here’s your clue</h2><p class="clue">${L.hint}</p>${hintLvl() >= 2 ? '<p class="hint">The key spot will glow while you play.</p>' : ''}<button class="btn" data-act="retry">Try again with the clue</button>`);
      }
    };
    if (prog.pass) grant(); else AdMock.show(type, grant);
  }
  const SC_BULLETS = 1;
  function restart() { if (!L) return; clearTimeout(pendingT); clearInterval(adTimer); clearCall(); if (lastFail && lastFail.offer && !scUsed) track('ad_declined', {type: lastFail.offer}); lastFail = null; track('retry', {ch: ci, lv: li}); eliCk = 1; loadLevel(li); go(); }
  function pause() { if (state !== 'play') return; state = 'pause'; MUS.duck(0.3); show(`<h2>Paused</h2><button class="btn" data-act="resume">Resume</button><button class="btn ghost" data-act="musicToggle">Music: ${musicOn ? 'on' : 'off'}</button><button class="btn ghost" data-act="menu">Levels</button><button class="btn ghost" data-act="home">Home</button>`); }
  function resume() { hide(); state = 'play'; MUS.duck(1); }
  ov.addEventListener('click', e => {
    const lv = e.target.closest('[data-lv]'); if (lv && !lv.disabled) return intro(+lv.dataset.lv);
    const chp = e.target.closest('[data-ch]'); if (chp && !chp.disabled) return menu(+chp.dataset.ch);
    const adb = e.target.closest('[data-ad]'); if (adb) return useOffer(adb.dataset.ad);
    if (e.target.closest('[data-adskip]')) return AdMock.skip();
    const adc = e.target.closest('[data-adcollect]'); if (adc) return AdMock.collect(+adc.dataset.adcollect);
    const op = e.target.closest('[data-part]');
    if (op) {
      const part = op.dataset.part, k = +op.dataset.k, o = AV[part][k];
      if (avAvailable(part, k)) { prog.avatar[part] = k; avConfirm = null; save(); }
      else if (o.price && o.unlock == null) avConfirm = prog.bucks >= o.price ? {part, k} : null, !avConfirm && call(`You need ${money(o.price)}`, true, 900);
      return avatarEditor();
    }
    const ab = e.target.closest('[data-avbuy]');
    if (ab) {
      if (ab.dataset.avbuy === 'yes' && avConfirm) { const o = AV[avConfirm.part][avConfirm.k]; const pc = avConfirm; if (buyItem(prog, o.price, pg => { pg.avOwned[avKey(pc.part, pc.k)] = true; })) { prog.avatar[pc.part] = pc.k; save(); sfx.cock(); track('purchase', {item: avKey(pc.part, pc.k), cost: o.price}); } }
      avConfirm = null; return avatarEditor();
    }
    const gun = e.target.closest('[data-gun]'); if (gun) return gunsmith(gun.dataset.gun);
    const fn = e.target.closest('[data-fin]'); if (fn) return gunsmith(sel.gun, +fn.dataset.fin);
    const buy = e.target.closest('[data-buy]'); if (buy && !buy.disabled) { confirmBuy = buy.dataset.buy; return gunsmith(); }
    const cf = e.target.closest('[data-confirm]');
    if (cf) {
      if (cf.dataset.confirm === 'yes') {
        const w = WBY[sel.gun], cost = confirmBuy === 'gun' ? w.price : w.fins[sel.fin].price;
        const kind = confirmBuy, f = sel.fin;
        if (buyItem(prog, cost, pg => { if (kind === 'gun') { pg.inv.guns[w.id] = true; pg.inv.fins[finKey(w.id, 0)] = true; } else pg.inv.fins[finKey(w.id, f)] = true; })) {
          if (kind === 'gun') sel.fin = 0;
          equip(w.id, sel.fin); save(); sfx.cock(); track('purchase', {item: kind === 'gun' ? w.id : finKey(w.id, f), cost});
        }
      }
      confirmBuy = null; return gunsmith();
    }
    if (e.target.closest('[data-equip]')) { equip(sel.gun, sel.fin); save(); sfx.cock(); return gunsmith(); }
    if (bgMode === 'office' && !prog.seenOffice && ov.querySelector('.coach')) { prog.seenOffice = true; save(); const c = ov.querySelector('.coach'); c && c.remove(); }
    const a = e.target.closest('[data-act]'); if (!a) return;
    if (a.classList.contains('hs') || a.classList.contains('wallet')) { if (a.dataset.act === 'board' || a.classList.contains('poster-hunt')) sfx.rustle(); else if (a.dataset.act === 'profile') sfx.tick2(); }
    if (a.dataset.act === 'enter') return enter();
    const acts = {menu: () => menu(), board, go, resume, next: () => intro(li + 1), retry: restart, home, hunt, profile, musicToggle: () => { musicOn = !musicOn; store.set('music', musicOn); MUS.refresh(); const b = ov.querySelector('[data-act=musicToggle]'); if (b) { if (b.classList.contains('mbtn')) { b.setAttribute('aria-pressed', musicOn); b.setAttribute('aria-label', musicOn ? 'Music on' : 'Music off'); b.classList.toggle('off', !musicOn); } else b.textContent = 'Music: ' + (musicOn ? 'on' : 'off'); } }, fresh: () => { eliCk = 1; prog.eliCk = 1; save(); go(); }, playtest, selftest, devCash: () => { prog.bucks += 1000; save(); playtest(); }, devAds: () => { dev.noAds = !dev.noAds; playtest(); }, devPass: () => { prog.pass = !prog.pass; save(); track('pass_toggled', {owned: prog.pass}); playtest(); }, devReset: () => { try { localStorage.removeItem('highnoon:progress3'); localStorage.removeItem('highnoon:events'); } catch (er) {} location.reload(); }, avatar: () => { avConfirm = null; avatarEditor(); },
      gunsmith: () => { sel = null; if (bgMode === 'office' && state === 'menu' && !doorAnim && ov.querySelector('.office')) { doorAnim = performance.now(); sfx.creak(); setTimeout(() => { doorAnim = 0; gunsmith(); }, 230); } else gunsmith(); },
      daily: () => { sfx.flip(); soon('daily'); }, survival: () => { sfx.tick2(); soon('survival'); }, store: () => soon('store'), duelsoon: () => { sfx.bell(); soon('duelsoon'); }};
    acts[a.dataset.act] && acts[a.dataset.act]();
  });
  ov.addEventListener('pointerdown', e => e.stopPropagation());
  document.getElementById('restartBtn').addEventListener('click', e => { e.currentTarget.blur(); if (L && state !== 'menu' && state !== 'intro' && state !== 'title') restart(); });
  document.getElementById('menuBtn').addEventListener('click', e => { e.currentTarget.blur(); state === 'pause' ? resume() : pause(); });
  const soundBtn = document.getElementById('soundBtn');
  function soundIcon() {
    soundBtn.innerHTML = `<svg viewBox="0 0 10 10"><path d="M1 3.5h2l3-2.5v8L3 6.5H1z" fill="#fff"/>${soundOn ? '<path d="M7.5 3a3 3 0 0 1 0 4" stroke="#fff" fill="none"/>' : '<path d="M7 3.5l2 3M9 3.5l-2 3" stroke="#fff"/>'}</svg>`;
    soundBtn.setAttribute('aria-label', soundOn ? 'Sound on' : 'Sound off');
  }
  soundBtn.addEventListener('click', () => { soundBtn.blur(); soundOn = !soundOn; store.set('sound', soundOn); soundIcon(); MUS.refresh(); });
  [soundBtn, document.getElementById('menuBtn'), document.getElementById('restartBtn')].forEach(b => b.addEventListener('pointerdown', e => e.stopPropagation()));
  soundIcon();

  // ---------- input ----------
  const toLocal = e => { const r = cv.getBoundingClientRect(); return {x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H}; };
  screenEl.addEventListener('pointerdown', e => { if (state !== 'play') return; e.preventDefault(); shoot(toLocal(e)); });
  screenEl.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') mouse = toLocal(e); });
  screenEl.addEventListener('pointerleave', () => { mouse = null; });
  screenEl.addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (state === 'title' && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); return enter(); }
    if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') { state === 'pause' ? resume() : pause(); return; }
    if ((e.key === 'r' || e.key === 'R') && L && ['play', 'pause', 'won', 'lost'].includes(state)) { restart(); return; }
    if ((e.key === ' ' || e.key === 'Enter') && state === 'play' && L && L.duel && e.target.tagName !== 'BUTTON') { e.preventDefault(); shoot({x: SC.duelX, y: GY - 22}); }
  });
  addEventListener('pointerdown', () => { if (soundOn) try { A(); } catch (e) {} }, {capture: true});
  addEventListener('blur', pause);
  matchMedia('(pointer:coarse) and (orientation:portrait)').addEventListener('change', m => { if (m.matches) pause(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); MUS.refresh(); });

  // ---------- loop ----------
  titleScreen();
  let last = performance.now(), acc = 0; const STEP = 1000 / 60;
  (function loop(t) {
    acc += Math.min(200, t - last); last = t;
    while (acc >= STEP) { if (hitStop > 0) { hitStop--; frame++; } else update(1 / 60); acc -= STEP; }
    if (!document.hidden) { draw(); hud(); }
    requestAnimationFrame(loop);
  })(last);
})();
</script>
</body>
</html>
